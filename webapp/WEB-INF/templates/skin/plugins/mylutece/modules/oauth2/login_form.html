<div class="container">
    <div class="row">
        <div class="col-xs-12 col-lg-12">
            <br>
            <br>
            <h1>#i18n{module.mylutece.oauth2.login_form.pageTitle}</h1>
            <br/>
            <br>
            <@messages errors=errors />
            <br>
            <div class="well">
                <#if user?? >
                    <h2>#i18n{module.mylutece.oauth2.login_form.titleConnected}</h2>
                    <img src="images/local/skin/plugins/mylutece/modules/oauth2/oauth2.png" alt=""/>
                    <br>
                    <br>
                    <a href="${url_dologout}" class="btn btn-primary">
                        <i class="glyphicon glyphicon-log-out" aria-hidden="true"></i>
                        #i18n{module.mylutece.oauth2.login_form.buttonSignOut}
                    </a>
                <#else>
                    <h2>#i18n{module.mylutece.oauth2.login_form.titleConnect}</h2>
                    <a href="servlet/plugins/oauth2/callback?data_client=authData" id="login">
                        <img src="images/local/skin/plugins/mylutece/modules/oauth2/oauth2.png" alt="#i18n{module.mylutece.oauth2.login_form.buttonSignIn}"/>
                    </a>
                </#if>
            </div>
            <br>
            <br>
            <br>
        </div>
    </div>
</div>
